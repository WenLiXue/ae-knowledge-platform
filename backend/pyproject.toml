[project]
name = "ae-knowledge-platform-backend"
version = "0.1.0"
description = "Backend service for the AE Knowledge Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "cryptography>=42,<45",
  # DD-21 LangGraph 知识助手（阶段 A 起加入，默认关闭 agent_graph_enabled）
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.1,<3.2",
  # 仅锁定 LangGraph 传递依赖的版本范围，业务代码不直接使用 langchain-core 类型
  "langchain-core>=1.6,<1.7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

