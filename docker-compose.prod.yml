services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ae_knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-ae_knowledge}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ae_knowledge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ae_knowledge}
      ENVIRONMENT: production
      STORAGE_ROOT: /app/backend/storage
      AUDIT_EXPORT_DIR: /app/backend/exports
      AUDIT_TRUSTED_PROXY_HEADER: x-forwarded-for
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data/storage:/app/backend/storage
      - ./data/exports:/app/backend/exports
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ae_knowledge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ae_knowledge}
      ENVIRONMENT: production
      STORAGE_ROOT: /app/backend/storage
      WORKER_ID: ${WORKER_ID:-ae-worker-1}
    command: python -m app.worker
    volumes:
      - ./data/storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
