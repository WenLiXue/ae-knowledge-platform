<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识查询 · Codex 式布局示例</title>
  <style>
    :root { --ink:#202124;--muted:#6f7378;--faint:#9aa0a6;--line:#e6e7e9;--strong:#d2d4d7;--canvas:#fbfbfa;--sidebar:#f3f3f1;--surface:#fff;--hover:#e9e9e6;--active:#e2e2df;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--canvas) }
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-width:320px}button,textarea,select{font:inherit}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(29,95,209,.2);outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;display:flex;flex-direction:column;height:100vh;padding:12px;border-right:1px solid var(--line);background:var(--sidebar)}
    .brand{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 8px 12px}.brand-mark{display:grid;width:28px;height:28px;place-items:center;border-radius:8px;background:#191a1b;color:#fff;font-size:12px;font-weight:750}.brand strong{font-size:14px;font-weight:650}.brand small{display:block;margin-top:1px;color:var(--muted);font-size:10px}
    .new-query{display:flex;width:100%;min-height:40px;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--strong);border-radius:8px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}.new-query:hover{background:#fafafa}.new-query kbd{color:var(--faint);font-size:11px;font-weight:500}
    .primary-nav{display:grid;gap:2px;margin-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}.nav-item{display:flex;min-height:36px;align-items:center;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--ink);font-size:13px;text-align:left;cursor:pointer}.nav-item:hover{background:var(--hover)}.nav-item.active{background:var(--active);font-weight:600}
    .history{min-height:0;flex:1;overflow:auto;padding:16px 0 8px}.history-title{display:flex;justify-content:space-between;padding:0 8px 7px;color:var(--muted);font-size:11px;font-weight:600}.history-list{display:grid;gap:1px}.history-item{display:block;width:100%;padding:8px 10px;border:0;border-radius:7px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.history-item:hover{background:var(--hover)}.history-item strong{display:block;overflow:hidden;font-size:12px;font-weight:560;text-overflow:ellipsis;white-space:nowrap}.history-item span{display:block;margin-top:3px;color:var(--muted);font-size:10px}
    .sidebar-footer{display:flex;min-height:44px;align-items:center;justify-content:space-between;padding:8px;border-top:1px solid var(--line)}.account strong{display:block;font-size:12px}.account small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.settings{min-height:30px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.settings:hover{background:var(--hover);color:var(--ink)}
    .main{display:grid;min-width:0;min-height:100vh;grid-template-rows:auto 1fr auto}.topbar{display:flex;min-height:58px;align-items:center;justify-content:space-between;padding:0 22px}.topbar-title{font-size:13px;font-weight:600}.topbar-actions{display:flex;gap:6px}.quiet{min-height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}.quiet:hover{background:#f0f0ee;color:var(--ink)}
    .welcome{display:grid;width:min(760px,calc(100% - 40px));align-content:center;justify-self:center;padding:36px 0 80px}.welcome-copy{margin-bottom:28px;text-align:center}.welcome-copy p{margin:0 0 8px;color:var(--muted);font-size:13px}.welcome-copy h1{margin:0;font-size:clamp(27px,4vw,38px);font-weight:620;line-height:1.25;letter-spacing:-.035em}
    .composer{border:1px solid var(--strong);border-radius:16px;background:#fff;overflow:hidden;transition:.16s ease}.composer:focus-within{border-color:#aeb3ba;box-shadow:0 3px 16px rgba(32,33,36,.08)}.composer textarea{display:block;width:100%;min-height:88px;padding:18px 18px 6px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;line-height:1.6}.composer textarea::placeholder{color:#8a8e93}
    .composer-footer{display:flex;min-height:52px;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 10px 12px}.tools{display:flex;min-width:0;align-items:center;gap:4px}.tool{min-height:32px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}.tool:hover,.tool[aria-expanded=true]{background:#f0f0ee;color:var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{min-height:28px;padding:0 8px;border:1px solid #d6d9dd;border-radius:7px;background:#f7f7f6;color:#4f5459;font-size:11px;cursor:pointer}
    .send{display:grid;width:34px;height:34px;flex:0 0 34px;place-items:center;border:0;border-radius:9px;background:#202124;color:#fff;font-size:16px;cursor:pointer}.send:hover{background:#000}.send:disabled{background:#dedfdf;color:#a4a6a8;cursor:not-allowed}
    .scope-panel{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}.scope-panel.open{display:grid}.scope-panel label{display:grid;gap:5px;color:var(--muted);font-size:10px}.scope-panel select{min-height:36px;padding:0 9px;border:1px solid var(--strong);border-radius:7px;background:#fff;color:var(--ink);font-size:12px}
    .suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:18px}.suggestion{min-height:54px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.suggestion:hover{background:#fff;border-color:var(--strong)}.suggestion strong{display:block;font-size:11px;font-weight:650}.suggestion span{display:block;overflow:hidden;margin-top:4px;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.helper{margin:9px 0 0;color:var(--faint);font-size:10px;text-align:center}.legal{align-self:end;padding:12px 24px 16px;color:var(--faint);font-size:10px;text-align:center}
    .toast{position:fixed;right:22px;bottom:22px;max-width:320px;padding:11px 14px;border:1px solid var(--strong);border-radius:9px;background:#202124;color:#fff;font-size:12px;opacity:0;transform:translateY(7px);pointer-events:none;transition:.16s ease}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding-bottom:4px}.new-query,.primary-nav,.history,.sidebar-footer{display:none}.topbar{min-height:50px}.welcome{width:min(680px,calc(100% - 28px));padding-top:22px}}
    @media(max-width:560px){.welcome{align-content:start;padding-top:64px}.welcome-copy{text-align:left}.scope-panel,.suggestions{grid-template-columns:1fr}.secondary{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="知识平台侧栏">
      <div class="brand"><div class="brand-mark" aria-hidden="true">AE</div><div><strong>知识智能平台</strong><small>AE Knowledge</small></div></div>
      <button class="new-query" id="new-query" type="button"><span>新建查询</span><kbd>Ctrl K</kbd></button>
      <nav class="primary-nav" aria-label="主导航"><button class="nav-item active" type="button">知识查询</button><button class="nav-item" type="button">文档库</button><button class="nav-item" type="button">问题诊断</button><button class="nav-item" type="button">系统管理</button></nav>
      <section class="history" aria-labelledby="history-title"><div class="history-title"><span id="history-title">最近会话</span><span>全部</span></div><div class="history-list">
        <button class="history-item" type="button"><strong>T90000 硬件规格</strong><span>今天 09:30</span></button><button class="history-item" type="button"><strong>国产化型号清单</strong><span>昨天 16:40</span></button><button class="history-item" type="button"><strong>网桥与路由模式区别</strong><span>8 月 21 日</span></button><button class="history-item" type="button"><strong>V7.0 部署方式</strong><span>8 月 19 日</span></button><button class="history-item" type="button"><strong>白云机场历史案例</strong><span>8 月 15 日</span></button>
      </div></section>
      <footer class="sidebar-footer"><div class="account"><strong>薛文李</strong><small>管理员</small></div><button class="settings" type="button">设置</button></footer>
    </aside>
    <main class="main">
      <header class="topbar"><div class="topbar-title">知识查询</div><div class="topbar-actions"><button class="quiet" type="button">帮助</button><button class="quiet" type="button">反馈</button></div></header>
      <section class="welcome" aria-labelledby="welcome-title">
        <header class="welcome-copy"><p>基于已入库的产品资料回答</p><h1 id="welcome-title">今天想查询什么？</h1></header>
        <div class="composer"><label class="sr-only" for="question">输入知识查询问题</label><textarea id="question" rows="3" placeholder="询问产品规格、部署方式、功能说明或历史案例"></textarea><div class="composer-footer"><div class="tools"><button class="tool" id="scope-trigger" type="button" aria-expanded="false" aria-controls="scope-panel">限定范围</button><button class="tool secondary" type="button">查询说明</button><div class="chips" id="chips"></div></div><button class="send" id="send" type="button" aria-label="发送查询" disabled>↑</button></div></div>
        <div class="scope-panel" id="scope-panel"><label>产品<select id="product"><option value="">全部产品</option><option>AE</option><option>T90000</option><option>V7 系列</option></select></label><label>版本<select id="version" disabled><option value="">请先选择产品</option></select></label><label>文档类型<select id="document-type"><option value="">全部类型</option><option>产品规格</option><option>部署文档</option><option>功能说明</option><option>历史案例</option></select></label></div>
        <div class="suggestions" aria-label="查询建议"><button class="suggestion" type="button" data-question="T90000 的 CPU、内存和磁盘配置是什么？"><strong>查询产品规格</strong><span>T90000 的 CPU、内存和磁盘配置</span></button><button class="suggestion" type="button" data-question="V7.0 的标准部署方式和环境要求是什么？"><strong>了解部署要求</strong><span>V7.0 的标准部署方式和环境要求</span></button><button class="suggestion" type="button" data-question="网桥模式和路由模式有什么区别？"><strong>比较功能模式</strong><span>网桥模式和路由模式的区别</span></button><button class="suggestion" type="button" data-question="有哪些白云机场相关的历史案例？"><strong>查找历史案例</strong><span>白云机场相关的实施与问题案例</span></button></div>
        <p class="helper">Enter 换行，Ctrl + Enter 查询</p>
      </section>
      <footer class="legal">答案基于企业知识库生成，请通过引用来源核验关键事实。</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const q=document.querySelector('#question'),send=document.querySelector('#send'),trigger=document.querySelector('#scope-trigger'),panel=document.querySelector('#scope-panel'),chips=document.querySelector('#chips'),product=document.querySelector('#product'),version=document.querySelector('#version'),type=document.querySelector('#document-type'),toast=document.querySelector('#toast');let timer;
    const syncSend=()=>send.disabled=!q.value.trim();
    function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}
    function syncScopes(){const values=[product.value&&{label:product.value,field:product},version.value&&{label:version.value,field:version},type.value&&{label:type.value,field:type}].filter(Boolean);chips.replaceChildren(...values.map(({label,field})=>{const chip=document.createElement('button');chip.className='chip';chip.type='button';chip.textContent=`${label} ×`;chip.onclick=()=>{field.value='';if(field===product){version.disabled=true;version.innerHTML='<option value="">请先选择产品</option>'}syncScopes()};return chip}))}
    trigger.onclick=()=>{const open=!panel.classList.contains('open');panel.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open))};
    product.onchange=()=>{version.disabled=!product.value;version.innerHTML=product.value?'<option value="">全部版本</option><option>7.0.3</option><option>7.1.0</option>':'<option value="">请先选择产品</option>';syncScopes()};version.onchange=syncScopes;type.onchange=syncScopes;q.oninput=syncSend;q.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&q.value.trim())send.click()};send.onclick=()=>show(`示例：开始查询“${q.value.trim()}”`);document.querySelector('#new-query').onclick=()=>{q.value='';syncSend();q.focus()};document.querySelectorAll('[data-question]').forEach(item=>item.onclick=()=>{q.value=item.dataset.question;syncSend();q.focus()});document.querySelectorAll('.history-item').forEach(item=>item.onclick=()=>show(`示例：打开“${item.querySelector('strong').textContent}”`));
  </script>
</body>
</html>
